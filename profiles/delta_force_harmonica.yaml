# 三角洲行动 · 守夜人口琴
#
# 输入模型:7 个音位键 × 4 种鼠标修饰态(四态互斥,见决策 D4)。
#   自然      不按鼠标修饰,直接敲音位键
#   降调(低八度) 按住鼠标左键
#   升半音        按住鼠标中键
#   升调(高八度) 按住鼠标右键
#
# 依据:docs/三角洲行动口琴玩法调研.md —— 界面实拍锁定 Z X C V B N M = 1 2 3 4 5 6 7,
# 左侧无键故低音只能按住左键;修饰态是 latch-while-held,不松手会持续影响后续音。
#
# ⚠️ 首次使用前请先做 M0 实测(见计划文档 §9),尤其是下面标"待自检"的两项。

id: delta_force_harmonica
name: 三角洲行动 · 守夜人口琴
group: 三角洲行动

pitch_keys: [Z, X, C, V, B, N, M]

modifier_buttons:
  lower: left      # 降调(低八度)
  semitone: middle # 升半音(滚轮按下)
  higher: right    # 升调(高八度)

# 物理直达键覆盖表(决策 D3):
# 命中后不再按修饰键。标点路径结构上不可能完整(最多覆盖高音 1-3,
# 而右键覆盖高音 1-7),故右键路径是必做的,这里只是"少一次修饰切换"的优化。
pitch_direct_overrides:
  # ✅ 中高可信:界面第 8 格即高音 ī;红凯谱原文"可以直接按 M 旁右边的逗号那个键"
  high_1: ","
  # ❌ 以下证据不足,MVP 不启用;待 P1-3 键位自检确认后再放开
  #    "." 唯一来源《花海》谱,其整行映射已被证伪(跳过 4、整体错位一格)
  #    "/" 无任何证据
  # high_2: "."
  # high_3: "/"

# 八度与半音同时被请求时(如 low+#):保八度、丢半音并告警
# 判据:八度错 = 整句跑偏;半音错 = 味道不对
modifier_policy: octave_first

# 三角洲不支持和弦,降级为取首个音
chord_policy: first

# 三角洲没有 21 键旧模型
legacy_keymap: null
