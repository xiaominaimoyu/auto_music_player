app:
  data_dir: data
  db_file: scores.db
  # 当前激活的游戏档位(profiles/ 目录下的档位 id)
  # 切换档位即切换输入模型;鸣潮/原神 与 三角洲行动 分属不同分区,互不影响
  # 可选值见 profiles/*.yaml;填错或缺失时回落到 default
  active_profile: default

recognizer:
  # provider: stub | openai_compatible
  # stub  = 内置样例,用于跑通流程,不调用真实 API
  # openai_compatible = 兼容 OpenAI 协议的多模态接口(通义/GLM/Kimi/OpenAI 均可用)
  provider: stub
  api_base: ""
  api_key: ""
  model: ""
  # 识别超时(秒)
  timeout: 120

# AI 编谱建议(实验性):默认关闭;接口凭据复用模型设置页当前激活供应商
advisor:
  # 是否启用
  enabled: false
  # 编谱用模型名;留空 = 使用激活供应商的模型
  model: ""

keymap:
  # 高音 1-7
  high: [Q, W, E, R, T, Y, U]
  # 中音 1-7
  mid: [A, S, D, F, G, H, J]
  # 低音 1-7
  low: [Z, X, C, V, B, N, M]

player:
  # 默认演奏速度(拍/分钟,四分音符为一拍)
  default_bpm: 100
  # 按键按住时间占音符时值的比例(0-1),其余为松开间隙,防止音符粘连
  hold_ratio: 0.75
  # 相邻音符之间的额外间隔(毫秒)
  gap_ms: 20
  # 鼠标修饰键按下 → 音符键按下 的间隔(毫秒)
  # 仅对「音位键 + 鼠标修饰态」输入模型的游戏生效(如三角洲行动口琴);
  # 过短时游戏可能尚未注册修饰态,会把高/低音弹成中音,实机可据此上调校准
  modifier_settle_ms: 30
  # 音符键松开 → 鼠标修饰键松开 的间隔(毫秒)
  modifier_release_ms: 20
  # 全局紧急停止热键
  stop_hotkey: F8
  # 系统输出延迟补偿(毫秒,延迟校准向导写入;0 = 不补偿)
  latency_compensation_ms: 0
  # 目标窗口焦点检测:演奏中失去目标窗口焦点时自动暂停(断点保留,可续播)
  focus_check:
    # 是否启用
    enabled: true
    # 检测周期(毫秒)
    poll_interval_ms: 400
    # 手动指定目标窗口标题子串(大小写不敏感);留空 = 开始演奏时自动快照当前前台窗口
    target_window_title: ""
