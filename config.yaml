config_version: 2

app:
  data_dir: data
  db_file: scores.db
  # auto:新安装版使用 %LOCALAPPDATA%,已有 exe 旁 data 或 portable.flag 保持便携；
  # portable:始终使用 exe 旁 data；installed:始终使用 %LOCALAPPDATA%。
  # Microsoft Store MSIX 通道会强制使用包身份对应的 LocalState，避免写入只读安装目录。
  data_mode: auto
  # 当前激活的游戏档位(profiles/ 目录下的档位 id)
  # 切换档位即切换输入模型;鸣潮/原神 与 三角洲行动 分属不同分区,互不影响
  # 可选值见 profiles/*.yaml;填错或缺失时回落到 default
  active_profile: default

keymap:
  # 高音 1-7
  high: [Q, W, E, R, T, Y, U]
  # 中音 1-7
  mid: [A, S, D, F, G, H, J]
  # 低音 1-7
  low: [Z, X, C, V, B, N, M]

update:
  # 定期检查新版，确认后将通过校验的 EXE 保存到所选目录，供手动替换。
  enabled: true
  manifest_urls:
    - https://gitee.com/muming04yue/auto_music_player/raw/main/updates/stable.json
    - https://raw.githubusercontent.com/xiaominaimoyu/auto_music_player/main/updates/stable.json
  # 发布验签公钥内置于程序，旧版配置中的 public_key 不参与验签。
  public_key: "6QF3M1S8xGQslxyJc2RLlCm8xy0HTRYXZvXk6RgMInY="
  check_interval_hours: 24

player:
  # 默认演奏速度(拍/分钟,四分音符为一拍)
  default_bpm: 100
  # 按键按住时间占音符时值的比例(0-1),其余为松开间隙,防止音符粘连
  hold_ratio: 0.75
  # 相邻发音之间的最小松开间隙(毫秒)。默认从音符时值里扣出，
  # 起音间隔仍等于谱面时值；只有音符短于这个间隙时才会把下一音撑开。
  gap_ms: 20
  # 修饰键在拍点之前按下，让音键落在拍上。上一音短到削不出这段时间时，
  # 才推迟当前音并记一条降级。false = 不预按，音键随修饰键顺延。
  modifier_prepress: true
  # true = 整段回到修正前的调度：间隙加在时值后面、修饰键推迟并推后时间轴、
  # 和弦逐键间隔 5ms、等待只用普通定时器。用来和修正后的听感对比。
  legacy_timing: false
  # 鼠标修饰键按下 → 音符键按下 的间隔(毫秒)
  # 仅对「音位键 + 鼠标修饰态」输入模型的游戏生效(如三角洲行动口琴);
  # 过短时游戏可能尚未注册修饰态,会把高/低音弹成中音,实机可据此上调校准
  modifier_settle_ms: 30
  # 音符键松开 → 鼠标修饰键松开 的间隔(毫秒)
  modifier_release_ms: 20
  # 全局紧急停止热键
  stop_hotkey: F8
  # 系统输出延迟补偿(毫秒,延迟校准向导写入;0 = 不补偿)
  latency_compensation_ms: 0
  # 真人化演奏节奏:起音微偏移 / 长短音动态按住 / 乐句呼吸,更贴近真人演奏
  humanize:
    # 是否启用(关闭后回到严格等间隔的机械节奏)
    enabled: true
    # 起音随机微偏移幅度(毫秒,正态分布 σ):真人不可能每个音都精准踩拍
    # 已优化:8→12ms,增强自然抖动感
    jitter_ms: 12
    # 乐句边界(长音或休止之后)追加的呼吸停顿(毫秒)
    # 已优化:18→25ms,换气感更明显
    breath_ms: 25
    # 乐句内起音偏移的相关系数，避免独立白噪声式抖动。
    # 实际标准差会校正到等于 jitter_ms，而不是被相关系数缩小。
    jitter_correlation: 0.65
    # 乐句速度弧的幅度(毫秒)。整句求和约等于 0，不会越播越拖。
    tempo_arc_ms: 8
    # 每小节第一拍提前的毫秒数，形成重音。
    accent_ms: 4
    # 和弦扫弦总时长(毫秒)。0 表示同时按下；建议 8–25。
    strum_ms: 12
  # 目标窗口焦点检测:演奏中失去目标窗口焦点时自动暂停(断点保留,可续播)
  focus_check:
    # 是否启用
    enabled: true
    # 检测周期(毫秒)
    poll_interval_ms: 400
    # 手动指定目标窗口标题子串(大小写不敏感);留空 = 开始演奏时自动快照当前前台窗口
    target_window_title: ""
